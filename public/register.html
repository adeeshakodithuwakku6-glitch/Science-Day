<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#46178f">
  <title>Create account — Science Day Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/auth-storage.js"></script>
</head>
<body class="auth-page flex min-h-screen items-center justify-center px-5 py-8 text-white">
  <main class="auth-shell w-full max-w-md">
    <header class="mb-7 text-center">
      <span class="auth-mark" aria-hidden="true">⚛</span>
      <a href="/" class="text-sm font-bold uppercase tracking-[.25em] text-purple-200 hover:text-white">School Science Day</a>
      <h1 class="mt-2 text-4xl font-black">Join the quiz</h1>
      <p class="mt-2 text-purple-100">Create an account to play.</p>
    </header>
    <section class="auth-card rounded-3xl p-7 text-slate-900 sm:p-8">
      <h2 class="text-2xl font-black">Create account</h2>
      <form id="register-form" class="mt-5 space-y-4">
        <label class="block text-sm font-bold" for="name">Your name
          <input id="name" maxlength="30" autocomplete="name" required
            class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 text-lg focus:border-purple-600 focus:outline-none focus:ring-2 focus:ring-purple-200">
        </label>
        <label class="block text-sm font-bold" for="email">Email
          <input id="email" type="email" maxlength="254" autocomplete="email" required
            class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 text-lg focus:border-purple-600 focus:outline-none focus:ring-2 focus:ring-purple-200">
        </label>
        <label class="block text-sm font-bold" for="password">Password
          <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required
            class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 text-lg focus:border-purple-600 focus:outline-none focus:ring-2 focus:ring-purple-200">
          <span class="mt-1 block font-normal text-slate-500">Use at least 8 characters.</span>
        </label>
        <button id="submit-button" class="w-full rounded-xl bg-purple-700 px-5 py-4 text-lg font-extrabold text-white hover:bg-purple-800">Create account</button>
      </form>
      <p class="mt-5 text-center text-slate-600">Already registered?
        <a class="font-bold text-purple-800 hover:underline" href="/login.html">Sign in</a>
      </p>
    </section>
    <p id="message" role="alert" class="mt-4 hidden rounded-xl bg-red-100 px-4 py-3 text-center font-bold text-red-900"></p>
  </main>
  <script>
    const form = document.getElementById("register-form");
    const button = document.getElementById("submit-button");
    const message = document.getElementById("message");

    async function checkExistingSession() {
      const response = await fetch("/api/auth/me");
      if (response.status === 401) return false;
      if (!response.ok) throw new Error("Could not check your sign-in. Please refresh the page.");
      const { user } = await response.json();
      quizAuthStorage.saveUser(user);
      redirectForRole(user);
      return true;
    }

    function redirectForRole(user) {
      if (user.role === "admin") {
        window.location.replace("/admin.html");
        return;
      }
      const pin = localStorage.getItem("scienceQuizPin");
      window.location.replace(/^\d{6}$/.test(pin || "") ? `/play.html?pin=${encodeURIComponent(pin)}` : "/");
    }

    checkExistingSession().catch((error) => {
      message.textContent = error.message;
      message.classList.remove("hidden");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.classList.add("hidden");
      button.disabled = true;
      button.textContent = "Creating account…";
      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Registration failed.");
        quizAuthStorage.saveUser(result.user);
        redirectForRole(result.user);
      } catch (error) {
        message.textContent = error.message;
        message.classList.remove("hidden");
      } finally {
        button.disabled = false;
        button.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
